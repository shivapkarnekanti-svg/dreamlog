name: Release

# Runs only for milestone tags. It re-verifies the tagged code, builds it with the public Firebase
# config and publishes the SHA-256 of every built file. It does not deploy: the maintainer deploys
# from their own machine for now, and /verify.html shows how to compare the live site to these hashes.
on:
  push:
    tags: ['m*-done']

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_USE_EMULATORS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools@15.34.0
      - run: npx playwright install --with-deps chromium
      # Everything except the build: the build below uses the real Firebase config.
      - run: npm run lint && npm run typecheck && npm test && npm run test:rules && npm run test:e2e && npm audit --audit-level=low
      - run: npm run build
      - name: Publish build hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/build-hashes.txt --title "$GITHUB_REF_NAME" --notes "SHA-256 of every file built from this tag. See /verify.html on the site."
